name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Validar motor nas capturas de teste
        run: python tests/run_samples.py
      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --name "Nightreign Seed Reader"
          --version-file version_info.txt
          --icon nrseed/assets/icon.ico
          --splash nrseed/assets/splash.png
          --add-data "nrseed/engine/data;nrseed/engine/data"
          --add-data "nrseed/engine/i18n;nrseed/engine/i18n"
          --add-data "nrseed/assets;nrseed/assets"
          main.py
      - name: Instalador
        run: Copy-Item "dist/Nightreign Seed Reader.exe" "NightreignSeedReader-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: NightreignSeedReader-Setup
          path: NightreignSeedReader-Setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NightreignSeedReader-Setup.exe
